{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}

    <div class="form-card">
        <h1>Admin Login</h1>
        <p class="subtitle">Sign in to manage student registrations.</p>

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="Senior Man" name="Senior Man" placeholder="e.g. John Doe" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="Seniorman237" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-full">Log In</button>
        </form>

        <p class="hint">Demo credentials: <code>admin</code> / <code>admin123</code></p>
    </div>

{% endblock %}
