{% extends "base.html" %}
{% block title %}Register Student{% endblock %}

{% block content %}

    <div class="form-card">
        <h1>Register a New Student</h1>
        <p class="subtitle">Fill in the details below to add a student.</p>

        <!-- method="POST" means the data will be sent to app.py's register() function -->
        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" placeholder="e.g. Aisha Bello" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="e.g. aisha@example.com" required>
            </div>

            <div class="form-group">
                <label for="course">Course *</label>
                <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="e.g. 20" min="1">
            </div>

            <button type="submit" class="btn btn-full">Register Student</button>
        </form>
    </div>

{% endblock %}
